name: onestools-ras-dev

services:
  # Основной контейнер разработки (.NET 8 SDK, opencode CLI, сетевые утилиты)
  dotnet-dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/1c-rac-lib:cached
      - nuget-cache:/home/vscode/.nuget/packages
      - opencode-local-share:/home/vscode/.local/share/opencode
      - opencode-cache:/home/vscode/.cache/opencode
    environment:
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_NOLOGO=1
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: sleep infinity
    depends_on:
      - clickhouse
      - mock-ras
      - ras

  # ClickHouse для разработки схем и интеграционных тестов
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8123:8123" # HTTP-интерфейс
      - "9000:9000" # Native-протокол
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-log:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Эмулятор RAS-сервера (SWP handshake). Заменяется реальным RAS 1С
  # изменением Host в appsettings.json.
  mock-ras:
    build:
      context: ..
      dockerfile: .devcontainer/mock-ras/Dockerfile
    ports:
      - "1545:1545"
    restart: unless-stopped

  # Реальный RAS-сервер "1С:Предприятие 8.3" (прокси к агенту кластера ragent).
  # Собрано из минимального набора файлов платформы: ras-minimal/Dockerfile.
  # Доступен из других контейнеров по адресу ras:1545; на хост проброшен 1546:1545,
  # т.к. 1545 на хосте уже занят mock-ras. RAS стартует, даже если ragent недоступен;
  # чтобы администрировать реальный кластер — задайте RAS_CLUSTER_ADDRESS (host[:port]).
  ras:
    build:
      context: ../ras-minimal
      dockerfile: Dockerfile
    environment:
      - RAS_PORT=1545
      - RAS_CLUSTER_ADDRESS=
    ports:
      - "1546:1545"
    restart: unless-stopped

volumes:
  nuget-cache:
  opencode-local-share:
  opencode-cache:
  clickhouse-data:
  clickhouse-log:
